# Perfil de desarrollo: suma los catálogos ficticios de db/datos-prueba y los usuarios,
# cuadrillas e instalaciones ficticios de db/datos-dev (nunca en el servidor ni en los tests)
spring.flyway.locations=classpath:db/migration,classpath:db/datos-prueba,classpath:db/datos-dev

# Escenario de la demo (#81): se genera al arrancar si no hay incidentes. En false, arranca sin él.
sigma.datos-demo.habilitado=true

# Logs de SIGMA en DEBUG solo en desarrollo (#95). Las librerías siguen en INFO.
logging.level.com.ciemsa.sigma=DEBUG
