spring.application.name=sigma

# Base de datos local (docker compose). Los valores por defecto son los de docker/.env.example
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:sigma_db}
spring.datasource.username=${POSTGRES_USER:sigma_user}
spring.datasource.password=${POSTGRES_PASSWORD:sigma_password}

# El esquema lo maneja Flyway; Hibernate solo valida que coincida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Listados paginados: 20 por defecto, máximo 100
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Sesión (CU-12): cookie HttpOnly; se vence tras 30 minutos sin actividad (*a)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Bloqueo temporal tras 5 intentos fallidos consecutivos (CU-12 4c)
sigma.seguridad.duracion-bloqueo=15m
