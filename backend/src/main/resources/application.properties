spring.application.name=sigma

# Base de datos local (docker compose). Los valores por defecto son los de docker/.env.example
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:sigma_db}
spring.datasource.username=${POSTGRES_USER:sigma_user}
spring.datasource.password=${POSTGRES_PASSWORD:sigma_password}

# El esquema lo maneja Flyway; Hibernate solo valida que coincida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Listados paginados: 20 por defecto, máximo 100
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Sesión (CU-12): cookie HttpOnly; se vence tras 9 horas sin actividad, un turno completo (*a)
server.servlet.session.timeout=9h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Bloqueo temporal tras 5 intentos fallidos consecutivos (CU-12 4c)
sigma.seguridad.duracion-bloqueo=15m

# Importación de instalaciones (HU-02, RF-29): organismo asignado y tamaño máximo de la planilla
sigma.importacion.organismo=MTOP
sigma.importacion.tamanio-maximo=2MB

# Subida de archivos. El límite de Spring es global: queda por encima del de cada caso de uso
# (planilla 2 MB; fotos 10 MB, #71), que controla su propio tamaño.
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=40MB

# Fotos de los incidentes (#71): fuera del repo. En el servidor, un volumen de Docker (SIGMA_ARCHIVOS).
sigma.archivos.directorio=${SIGMA_ARCHIVOS:${user.home}/.sigma/archivos}

