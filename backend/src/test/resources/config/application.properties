# Se carga además de src/main/resources/application.properties (Spring Boot lee también
# classpath:/config/). Los tests usan los catálogos ficticios, igual que el perfil dev.
spring.flyway.locations=classpath:db/migration,classpath:db/datos-prueba

# Fotos de los tests (#71): a una carpeta temporal, nunca a la del usuario.
sigma.archivos.directorio=${java.io.tmpdir}/sigma-tests/archivos

